# Privacy-Proxy zwischen lokalem LLM (OpenWebUI) und dem Internet.
#
# Durchsetzung passiert ueber die Netze, nicht ueber Konvention:
#   core    internal -> keine Route ins Internet. Filter, SearXNG und Valkey
#                       haengen ausschliesslich hier.
#   egress  bridge   -> webproxy und gateway. Weg nach draussen.
#   edge    bridge   -> nur edge (nginx). Nimmt Anfragen von OpenWebUI an,
#                       baut selbst nie eine Verbindung nach aussen auf.
#
# Folge: Suchanfragen verlassen den Stack ausschliesslich ueber webproxy, und
# der sieht nur bereits gefilterte Anfragen. Filter, SearXNG und Valkey haben
# gar keine Route.
#
# Der Gateway haengt zusaetzlich im egress-Netz, damit er Telemetrie an
# aimonitor senden kann. Damit hat ausgerechnet der Dienst, der die
# ungefilterte Anfrage sieht, vollen Netzzugang. Dass er nur Zaehler
# verschickt, ist seit dieser Aenderung eine Eigenschaft des Codes, keine
# des Netzes. Wer die harte Trennung zurueck will: 'egress' beim Gateway
# entfernen und AIMON_URL leeren.

# Fester Projektname. Ohne ihn leitet Compose ihn aus dem Verzeichnisnamen
# ab - ein umbenanntes Verzeichnis legt dann stillschweigend einen zweiten,
# vollstaendigen Stack an, inklusive eigener Netze. Die Container des alten
# halten weiter ihre Ports, und OpenWebUI haengt am Netz des alten.
name: searxng-privacy-proxy

services:

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_PORT:-8888}:8888"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
      - core
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, nicht localhost: busybox-wget loest localhost zu ::1 auf,
      # nginx lauscht mit "listen 8888;" aber nur auf IPv4 - der Healthcheck
      # scheiterte dadurch dauerhaft, obwohl der Dienst lief.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8888/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      FILTER_URL: http://filter:8001
      SEARX_URL: http://searxng:8080
      VALKEY_URL: redis://valkey:6379/0
      GATEWAY_BLOCK_RESPONSE: ${GATEWAY_BLOCK_RESPONSE:-inform}
      GATEWAY_LOG_QUERIES: ${GATEWAY_LOG_QUERIES:-redacted}
      GATEWAY_CACHE_TTL: ${GATEWAY_CACHE_TTL:-900}
      GATEWAY_MAX_QUERY_LEN: ${GATEWAY_MAX_QUERY_LEN:-512}
      GATEWAY_MAX_RESULTS: ${GATEWAY_MAX_RESULTS:-20}
      GATEWAY_UPSTREAM_TIMEOUT: ${GATEWAY_UPSTREAM_TIMEOUT:-20}
      GATEWAY_DEFAULT_LANG: ${FILTER_DEFAULT_LANG:-de}
      # Telemetrie. Leere AIMON_URL = aus.
      AIMON_URL: ${AIMON_URL:-}
      AIMON_TOKEN: ${AIMON_TOKEN:-}
      AIMON_NODE: ${AIMON_NODE:-}
      AIMON_SERVICE_KEY: ${AIMON_SERVICE_KEY:-}
      AIMON_BASE_URL: ${AIMON_BASE_URL:-}
      AIMON_INTERVAL: ${AIMON_INTERVAL:-10}
      AIMON_TIMEOUT: ${AIMON_TIMEOUT:-5}
      AIMON_QUEUE_MAX: ${AIMON_QUEUE_MAX:-5000}
      AIMON_BATCH_MAX: ${AIMON_BATCH_MAX:-500}
      AIMON_SEND_REDACTED_QUERIES: ${AIMON_SEND_REDACTED_QUERIES:-false}
      AIMON_SEND_RAW_QUERIES: ${AIMON_SEND_RAW_QUERIES:-false}
      AIMON_SEND_QUERY_HASH: ${AIMON_SEND_QUERY_HASH:-true}
      AIMON_QUERY_HASH_SALT: ${AIMON_QUERY_HASH_SALT:-}
    networks:
      - core
      # Fuer die Telemetrie an aimonitor. ACHTUNG: damit hat der Gateway
      # vollen Netzzugang - also der Dienst, der die UNGEFILTERTE Anfrage
      # sieht. Die urspruengliche Zusage "kann sie technisch nicht
      # verschicken" gilt damit nicht mehr; es bleibt eine organisatorische
      # Zusicherung. Ohne Telemetrie diese Zeile entfernen.
      - egress
    depends_on:
      filter:
        condition: service_healthy
      valkey:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  filter:
    build:
      context: ./filterd
      args:
        SPACY_DE: ${FILTER_SPACY_DE:-de_core_news_md}
        SPACY_EN: ${FILTER_SPACY_EN:-en_core_web_md}
    restart: unless-stopped
    environment:
      FILTER_POLICY: /app/config/policy.yml
      FILTER_SPACY_DE: ${FILTER_SPACY_DE:-de_core_news_md}
      FILTER_SPACY_EN: ${FILTER_SPACY_EN:-en_core_web_md}
      FILTER_DEFAULT_LANG: ${FILTER_DEFAULT_LANG:-de}
    volumes:
      - ./config/policy.yml:/app/config/policy.yml:ro
    networks:
      - core
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/healthz',timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 10
      # NER-Modelle brauchen beim Start Zeit.
      start_period: 120s

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET fehlt - scripts/init.sh ausfuehren}
      SEARXNG_BASE_URL: http://searxng:8080/
      # SearXNG erreicht das Internet ausschliesslich ueber diesen Proxy.
      HTTP_PROXY: http://webproxy:3128
      HTTPS_PROXY: http://webproxy:3128
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - ./config/searxng:/etc/searxng:rw
    networks:
      - core
    depends_on:
      webproxy:
        condition: service_started
    # Bewusst ohne cap_drop: der SearXNG-Entrypoint setzt Rechte und wechselt
    # den Benutzer. Haertung hier bricht das Image.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  webproxy:
    build: ./config/tinyproxy
    restart: unless-stopped
    networks:
      - core
      - egress
    security_opt:
      - no-new-privileges:true

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    networks:
      - core
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    driver: bridge
  core:
    driver: bridge
    internal: true
  egress:
    driver: bridge
