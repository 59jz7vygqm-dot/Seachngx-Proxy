# Einziger Weg ins Internet. Alles andere im core-Netz hat keine Route nach
# draussen (docker-compose.yml: core ist internal).

User tinyproxy
Group tinyproxy
Port 3128
Timeout 600

PidFile "/tmp/tinyproxy.pid"
LogFile "/dev/stdout"
# Warning statt Info: Info loggt jede angefragte URL - das waere genau das
# Klartext-Log, das dieses Projekt vermeiden will.
LogLevel Warning

MaxClients 100
StartServers 5
MinSpareServers 5
MaxSpareServers 20

# Nur Docker-interne Netze duerfen den Proxy benutzen.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Keine Via-/X-Tinyproxy-Header, die die interne Topologie verraten.
DisableViaHeader Yes

# Kein AnonymousHeader hier: die Direktive ist in tinyproxy eine ALLOWLIST -
# alles nicht Gelistete wird entfernt, inklusive User-Agent und Accept. Das
# bricht die Suchmaschinen. Header-Hygiene macht SearXNG selbst.

ConnectPort 443
ConnectPort 563

# Optional: harte Ziel-Allowlist. Macht den Egress zu default-deny, bricht
# aber jede SearXNG-Engine, die nicht in der Liste steht.
#Filter "/etc/tinyproxy/filter"
#FilterURLs Off
#FilterExtended On
#FilterDefaultDeny Yes
